name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DurLineScanner.slnx

      - name: Build
        run: dotnet build DurLineScanner.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/DurLineScanner.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DurLineScanner.Tests/TestResults/*.trx
