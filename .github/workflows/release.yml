name: Release

# Ein Tag wie v1.0.0 baut Setup und portable ZIP und legt ein GitHub-Release an.
# Manuell gestartet entstehen nur die Artefakte (ohne Release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 1.0.0)'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ github.event.inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/DurLineScanner.Tests --configuration Release

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/DurLineScanner/DurLineScanner.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishReadyToRun=true
          --output publish/DurLineScanner

      - name: Portable ZIP
        shell: pwsh
        run: |
          Copy-Item docs/BENUTZERHANDBUCH.md, docs/USER_GUIDE.md, LICENSE publish/DurLineScanner/
          Compress-Archive -Path publish/DurLineScanner/* -DestinationPath "publish/DurLineScanner-${{ steps.version.outputs.version }}-win-x64-portable.zip"

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Setup bauen
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\publish\DurLineScanner" "/O$PWD\publish" installer\DurLineScanner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DurLineScanner-${{ steps.version.outputs.version }}
          path: |
            publish/*.exe
            publish/*.zip

      - name: GitHub-Release anlegen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: DUR-line Scanner ${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Versionen unter 1.0 und Tags mit Zusatz (z.B. v1.1.0-beta) als Vorabversion
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') || contains(steps.version.outputs.version, '-') }}
          files: |
            publish/*.exe
            publish/*.zip
